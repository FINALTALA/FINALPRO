services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finalpro
      POSTGRES_PASSWORD: finalpro_dev_only
      POSTGRES_DB: finalpro
    ports:
      # Windows host port 5432 is already used by another local PostgreSQL
      # instance. Keep PostgreSQL's container port standard, but expose this
      # project's database to desktop tools (pgAdmin) on host port 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalpro -d finalpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
