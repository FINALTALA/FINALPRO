services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finalpro
      POSTGRES_PASSWORD: finalpro_dev_only
      POSTGRES_DB: finalpro
    ports:
      # Windows host port 5432 is already used by another local PostgreSQL
      # instance. Keep PostgreSQL's container port standard, but expose this
      # project's database to desktop tools (pgAdmin) on host port 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalpro -d finalpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # VIA phase 5: the platform Media Library volume (platform-owned images
  # and videos, never merchant uploads). A named Docker volume bound to the
  # host directory the API reads as PLATFORM_MEDIA_DIR, so a host-run API
  # and any container see the same files. This tools service is opt-in
  # (`docker compose --profile media-tools run --rm media-tools`) and
  # mounts it read-only for inspection; the coordinated database + media
  # backup is apps/api/scripts/platform-media-backup.ts.
  media-tools:
    image: postgis/postgis:16-3.4-alpine
    profiles: ["media-tools"]
    entrypoint: ["sh"]
    volumes:
      - platform_media:/platform-media:ro

volumes:
  postgres_data:
  platform_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      # An absolute host path - the same value as the API's PLATFORM_MEDIA_DIR.
      device: ${PLATFORM_MEDIA_HOST_DIR:-/var/lib/via/platform-media}
